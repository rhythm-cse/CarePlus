<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile | CarePlus</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;font-family:Arial,sans-serif;color:#203449}header{background:#087e8b;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header nav{display:flex;gap:10px;flex-wrap:wrap}header a{color:white;text-decoration:none;border:1px solid #ffffff99;padding:9px 13px;border-radius:8px}.wrap{max-width:720px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e5ebf1;border-radius:18px;padding:28px;box-shadow:0 8px 25px #1832470d}.panel h1{color:#087e8b;margin-top:0}.field{margin:16px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #d5dee8;border-radius:9px;font-size:15px}.field input[readonly]{background:#f0f3f6}.save{background:#087e8b;color:#fff;border:0;padding:13px 18px;border-radius:9px;font-weight:bold;cursor:pointer}.message{margin:12px 0;color:#087e8b}
</style></head><body><header><h2>CarePlus +</h2><nav><a href="/patient/dashboard">Dashboard</a><a href="/patient/appointments">My Appointments</a><a href="/doctors">Book Appointment</a><a href="/logout">Logout</a></nav></header><main class="wrap"><section class="panel"><h1>My Profile</h1><p>View and update your personal information.</p><div id="message" class="message" role="status"></div><form id="profileForm"><div class="field"><label for="full_name">Full Name</label><input id="full_name" maxlength="100" required value="{{ patient.full_name|e }}"></div><div class="field"><label for="gender">Gender</label><select id="gender" required><option value="Male" {% if patient.gender=='Male' %}selected{% endif %}>Male</option><option value="Female" {% if patient.gender=='Female' %}selected{% endif %}>Female</option><option value="Other" {% if patient.gender=='Other' %}selected{% endif %}>Other</option></select></div><div class="field"><label for="date_of_birth">Date of Birth</label><input type="date" id="date_of_birth" required value="{{ patient.date_of_birth }}"></div><div class="field"><label for="phone">Phone Number</label><input id="phone" inputmode="numeric" minlength="10" maxlength="15" required value="{{ patient.phone|e }}"></div><div class="field"><label>Email Address</label><input readonly value="{{ patient.email|e }}"></div><button class="save" type="submit">Save Changes</button></form></section></main>
<script>document.getElementById('profileForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),b=e.target.querySelector('button');m.textContent='Saving...';b.disabled=true;try{const r=await fetch('/api/my-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:document.getElementById('full_name').value.trim(),gender:document.getElementById('gender').value,date_of_birth:document.getElementById('date_of_birth').value,phone:document.getElementById('phone').value.trim()})});const d=await r.json();m.textContent=d.message||'Please try again.';if(r.ok&&d.success)m.style.color='#087e8b';else m.style.color='#b42318'}catch(err){m.textContent='Server connection error.';m.style.color='#b42318'}finally{b.disabled=false}});</script></body></html>
