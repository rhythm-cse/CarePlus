<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Appointments | CarePlus</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;font-family:Arial,sans-serif;color:#203449}header{background:#087e8b;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header nav{display:flex;gap:10px;flex-wrap:wrap}header a{color:white;text-decoration:none;border:1px solid #ffffff99;padding:9px 13px;border-radius:8px}main{max-width:1050px;margin:35px auto;padding:0 18px}.intro,.appointment,.empty{background:#fff;border:1px solid #e5ebf1;border-radius:16px;padding:23px;margin-bottom:17px;box-shadow:0 7px 22px #1832470a}.intro h1{margin:0 0 8px;color:#087e8b}.intro p,.muted{color:#718096}.appointment h2{color:#087e8b;margin:0 0 12px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.details p{margin:4px 0}.status{display:inline-block;margin-top:14px;padding:7px 12px;border-radius:20px;background:#fff2d6;color:#8b6200;text-transform:capitalize;font-weight:bold;font-size:13px}.status.confirmed{background:#dcfce7;color:#166534}.status.completed{background:#dbeafe;color:#1e40af}.status.cancelled{background:#fee2e2;color:#991b1b}.cancel{display:block;margin-top:15px;background:#dc3545;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}.cancel:disabled{opacity:.6}.message{margin:10px 0;color:#087e8b}@media(max-width:600px){.details{grid-template-columns:1fr}}
</style></head><body><header><h2>CarePlus +</h2><nav><a href="/patient/dashboard">Dashboard</a><a href="/doctors">Book Appointment</a><a href="/patient/profile">My Profile</a><a href="/logout">Logout</a></nav></header><main><section class="intro"><h1>My Appointments</h1><p>Hello {{ patient_name }}, here you can view and manage your bookings.</p></section><p id="message" class="message" role="status"></p><div id="appointments"><div class="empty">Loading your appointments...</div></div></main>
<script>
const target=document.getElementById('appointments'),msg=document.getElementById('message');
function esc(v){return String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){try{const r=await fetch('/api/my-appointments');const d=await r.json();if(!r.ok||!d.success){target.innerHTML='<div class="empty">Unable to load appointments. Please login again.</div>';return}const list=d.appointments||[];if(!list.length){target.innerHTML='<div class="empty"><h3>No appointments yet</h3><p class="muted">You have not booked any appointments.</p><a href="/doctors">Find a doctor and book now</a></div>';return}target.innerHTML=list.map(a=>{const st=(a.status||'pending').toLowerCase(),can=['pending','confirmed'].includes(st);return `<article class="appointment"><h2>Dr. ${esc(a.doctor_name)}</h2><div class="details"><p><b>Appointment ID:</b> ${esc(a.appointment_id)}</p><p><b>Specialization:</b> ${esc(a.specialization)}</p><p><b>Hospital:</b> ${esc(a.hospital_name)}</p><p><b>Date:</b> ${esc(a.available_date)}</p><p><b>Time:</b> ${esc(a.start_time)} – ${esc(a.end_time)}</p><p><b>Reason:</b> ${esc(a.reason||'Not specified')}</p></div><span class="status ${esc(st)}">${esc(st)}</span>${can?`<button class="cancel" onclick="cancelBooking(${Number(a.appointment_id)},this)">Cancel Appointment</button>`:''}</article>`}).join('')}catch(e){target.innerHTML='<div class="empty">Server connection error. Please try again.</div>'}}
async function cancelBooking(id,btn){if(!confirm('Are you sure you want to cancel this appointment?'))return;btn.disabled=true;btn.textContent='Cancelling...';try{const r=await fetch(`/api/appointments/${id}/cancel`,{method:'POST'});const d=await r.json();msg.textContent=d.message||'';if(!r.ok||!d.success){btn.disabled=false;btn.textContent='Cancel Appointment';return}await load()}catch(e){msg.textContent='Server connection error.';btn.disabled=false;btn.textContent='Cancel Appointment'}}
load();
</script></body></html>
