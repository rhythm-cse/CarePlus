
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarePlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f7fa, #f4f7fc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(20, 60, 80, .12);
        }
        .logo {
            color: #07858d;
            font-size: 30px;
            font-weight: bold;
        }
        .subtitle { color: #718096; }
        .form-control {
            padding: 12px;
            border-radius: 10px;
        }
        .btn-login {
            background: #07858d;
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-login:hover {
            background: #066d75;
            color: white;
        }
        a { color: #07858d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo">CarePlus +</div>
            <h3 class="mt-3">Welcome Back!</h3>
            <p class="subtitle">Login to manage your appointments</p>
        </div>

        <div id="message"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="showPassword">
                <label class="form-check-label" for="showPassword">
                    Show password
                </label>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Login to CarePlus
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

        <p class="text-center mt-3">
            <a href="/">← Back to Home</a>
        </p>
    </div>

    <script>
        document.getElementById("showPassword").addEventListener("change", function () {
            document.getElementById("password").type =
                this.checked ? "text" : "password";
        });

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const message = document.getElementById("message");
            message.innerHTML = "";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const result = await response.json();

                if (result.success) {
                    message.innerHTML =
                        '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    window.location.href = result.redirect || "/patient/dashboard";
                } else {
                    message.innerHTML =
                        '<div class="alert alert-danger">' +
                        (result.message || "Login failed. Please try again.") +
                        '</div>';
                }
            } catch (error) {
                message.innerHTML =
                    '<div class="alert alert-danger">Server connection failed. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
