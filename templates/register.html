
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CarePlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f7fa, #f4f7fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
        }
        .register-card {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(20, 60, 80, .12);
        }
        .logo {
            color: #07858d;
            font-size: 30px;
            font-weight: bold;
        }
        .subtitle { color: #718096; }
        .form-control, .form-select {
            padding: 11px;
            border-radius: 9px;
        }
        .btn-register {
            background: #07858d;
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-register:hover {
            background: #066d75;
            color: white;
        }
        a { color: #07858d; text-decoration: none; }
    </style>
</head>
<body>
<div class="register-card">
    <div class="text-center mb-4">
        <div class="logo">CarePlus +</div>
        <h3 class="mt-3">Create Your Account</h3>
        <p class="subtitle">Register to book hospital appointments online</p>
    </div>

    <div id="message"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" id="full_name" class="form-control"
                   placeholder="Enter your full name" required maxlength="100">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Gender</label>
                <select id="gender" class="form-select" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Date of Birth</label>
                <input type="date" id="date_of_birth" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="tel" id="phone" class="form-control"
                   placeholder="Enter 10-digit mobile number"
                   pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" id="email" class="form-control"
                   placeholder="Enter your email" required maxlength="150">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Create a password" minlength="8" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-control"
                   placeholder="Enter password again" required>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="showPassword">
            <label class="form-check-label" for="showPassword">
                Show passwords
            </label>
        </div>

        <button type="submit" class="btn btn-register w-100">
            Create Account
        </button>
    </form>

    <p class="text-center mt-4 mb-0">
        Already have an account? <a href="/login">Login</a>
    </p>
    <p class="text-center mt-3">
        <a href="/">← Back to Home</a>
    </p>
</div>

<script>
    document.getElementById("date_of_birth").max =
        new Date().toISOString().split("T")[0];

    document.getElementById("showPassword").addEventListener("change", function () {
        const type = this.checked ? "text" : "password";
        document.getElementById("password").type = type;
        document.getElementById("confirm_password").type = type;
    });

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const message = document.getElementById("message");
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {
            message.innerHTML = '<div class="alert alert-danger">Passwords do not match.</div>';
            return;
        }

        const payload = {
            full_name: document.getElementById("full_name").value.trim(),
            gender: document.getElementById("gender").value,
            date_of_birth: document.getElementById("date_of_birth").value,
            phone: document.getElementById("phone").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: password
        };

        try {
            const response = await fetch("/api/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                message.innerHTML = '<div class="alert alert-success">Registration successful! Redirecting to login...</div>';
                setTimeout(() => window.location.href = "/login", 1200);
            } else {
                message.innerHTML = '<div class="alert alert-danger">' +
                    (result.message || "Registration failed.") + '</div>';
            }
        } catch (error) {
            message.innerHTML = '<div class="alert alert-danger">Server connection failed.</div>';
        }
    });
</script>
</body>
</html>
